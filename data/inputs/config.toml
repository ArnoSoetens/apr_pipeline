# ============================================================================
# APR pipeline configuration -- the one file you edit.
#
#  * It lives in <data folder>/inputs/ together with the host files (BCD.pdb, .mol2, .frcmod),
#    the SMILES list and, once things run, the Amber .in files and results.csv. Archiving the
#    data folder therefore keeps every setting and input of the simulations.
#  * The data folder is <repository>/data, or the folder in the environment variable APR_DATA.
#    All other folders follow from it: data/inputs, data/logs (slurm logs, worklists), and the
#    code's own folders (scripts/, apr_pipeline/, scripts/templates/).
#  * Python reads it through apr_pipeline/apr_config.py. Bash cannot read TOML, so
#    scripts/config_env.py turns the values bash needs into `export` lines.
# ============================================================================

# ---------------------------------------------------------------------------
[input]
smiles_list = "wall.txt"    # SMILES list in data/inputs/, one per line; only read when the
                                 # data folder has no data point folders yet

# ---------------------------------------------------------------------------
[naming]
host_prefix    = "BCD"
guest_prefix   = "UNL"       # also the residue name of the guest
complex_prefix = "BCD-UNL"   # complex PDB is <complex_prefix>.pdb, final system <complex_prefix>-dum.prmtop
                             # use "" to build it as <host_prefix>-<guest_prefix>
folder_prefix  = "iso_"      # data point folders: iso_00001, iso_00002, ...
folder_digits  = 5

# ---------------------------------------------------------------------------
[structure]                  # SMILES -> 3D guest (RDKit)
output_pdb    = "UNL.pdb"    # file the 3D guest is written to in the data point folder. Use the same
                             # name as <guest_prefix>.pdb to let placement overwrite it (one file less);
                             # any other name keeps the unplaced structure next to the placed one.
conformers    = 1
random_seed   = 42
uff_max_iters = 1000

# ---------------------------------------------------------------------------
[placement]                  # guest placement in the host cavity
cavity_center = [0.0, 0.0, 0.0]   # the midpoint of the guest backbone goes here
cavity_axis   = [0.0, 0.0, 1.0]   # the guest backbone is aligned with this axis
clash_cutoff  = 1               # Angstrom; a closer host-guest pair rejects the guest
guest_resnum  = 2                 # residue number of the guest in the PDB files

# ---------------------------------------------------------------------------
[parametrize]                # antechamber / parmchk2
net_charge    = "auto"       # fills an empty net_charge in each guest_input.json (parametrize uses that):
                             # "auto" = the SMILES' charge (PDB-only guests: set it in the JSON by hand);
                             # an integer, e.g. -1 = that charge. A charge already in a JSON is never
                             # replaced: edit it there, or set it to null to apply this value again.
charge_method = "bcc"
atom_type     = "gaff"       # antechamber -at, and leaprc.<atom_type> in tleap
parmchk_set   = 1            # parmchk2 -s  (1 = gaff, 2 = gaff2)

# ---------------------------------------------------------------------------
[functionalize]              # optional RDKit transformation before data-point directories are made
enabled        = false         # false: use enumerated molecules as-is; true: create group-substituted products
site_strategy  = "backbone_ends"  # backbone_ends or all_terminal
replace_policy = "h_first_cf3_only"  # replace H first; replace F only on a terminal CF3 carbon

[functionalize.groups]       # the first atom in each fragment is bonded to the selected carbon
carboxylate      = "C(=O)[O-]"
carboxylic_acid  = "C(=O)O"
sulfonate        = "S(=O)(=O)[O-]"
hydroxyl         = "O"
amine            = "N"
ammonium         = "[NH3+]"

# ---------------------------------------------------------------------------
[apr]
# attach phase: percent of the final force constant, one value per window
attach_string    = "0.00 0.01 0.0375 0.40 0.80 1.60 2.40 4.00 5.50 8.65 11.80 18.10 24.40 37.00 49.60 74.80 100.00"
# pull phase: host-guest distance in Angstrom; windows = initial, initial+step, ... final
initial_distance = 6.0 #APR setup will translate the complex to achieve this distance at the DM1 distance 
final_distance   = 20.0
step             = 0.5

dummy_z           = [-6.0, -9.0, -11.2]   # z of dummy atoms DM1, DM2, DM3
dummy3_y          = 2.2                   # y of DM3
host_anchor_atoms = [75, 33, 138]         # BCD atom numbers used to hold the host in place

[apr.restraints]
distance_fc            = 10.0     # kcal/mol/A^2   (guest distance restraint)
angle_fc               = 100.0    # kcal/mol/rad^2
torsion_fc             = 100.0
angle_target           = 180.0    # degrees
torsion_target         = 180.0
static_fc              = [10.0, 100.0, 100.0, 100.0, 100.0, 100.0]   # the six host-dummy restraints, in order
host_conformational_fc = 10.0     # per-glucose conformational restraints

[apr.restraints.walls.distance]
enabled = false
mode = "rim"             # "manual" uses r1-r4 below; "rim" derives r2/r3 from the fitted rims
rim_atom_groups = [
    [10, 31, 52, 73, 94, 115, 136],
    [20, 41, 62, 83, 104, 125, 146],
]
guest = "centroid"       # "g1": wall on the DM1-G1 distance; "centroid": on the distance from DM1
                         # to the centroid of all guest atoms (Amber group restraint)
rim_offset = 2.0         # guest = "g1": r2/r3 = near/far rim -/+ rim_offset
radius_offset = -1.0     # guest = "centroid": r2/r3 = near/far rim -/+ (guest radius + radius_offset);
                         # guest radius = largest centroid-to-heavy-atom distance, so 0 starts the
                         # wall where the whole guest has left the cavity along the axis
parabolic_width = 1.0

r1 = 0.0                  # manual Amber flat-well bounds (Angstroms)
r2 = 1.0
r3 = 12.0
r4 = 13.0
rk2 = 100.0               # left parabolic force constant (kcal/mol/A^2)
rk3 = 100.0               # right parabolic force constant (kcal/mol/A^2)
# Only needed in rim mode: configure two groups of seven host rim oxygens,
# plus rim_offset and parabolic_width.

[apr.restraints.walls.cone]
# Flat-bottom D2-D1-G1 angle wall (attach windows only): no force from 180 degrees down to the
# angle of the rim nearest DM1 (mean D2-D1-O over its oxygens from walls.distance.rim_atom_groups,
# which it needs even when the distance wall is manual or off), harmonic below that.
enabled = false
guest = "centroid"        # "g1": D2-D1-G1 angle; "centroid": D2-D1-guest centroid (all guest atoms)
angle_offset = 0.0        # degrees; > 0 widens the cone beyond the rim oxygens, < 0 narrows it
parabolic_width = 5.0     # degrees between r1 and r2 (linear beyond r1)
rk2 = 100.0               # kcal/mol/rad^2

# ---------------------------------------------------------------------------
[analysis]
enhanced         = true           # true: also the convergence plot, attach-window grid, pull-window
                                  # histograms and extra metadata (analysis.py --enhanced/--no-enhanced
                                  # overrides it for one run); false: results.json + binding plot, faster
method           = "ti"           # primary plot/overall result; both TI and MBAR are analyzed
bootstrap_cycles = 1000
trajectory       = "production.nc"   # file read from every window
results_csv      = "inputs/results.csv"   # relative to the data folder

# ---------------------------------------------------------------------------
[run]
pmemd     = "serial"   # "serial" -> pmemd, "cuda" -> pmemd.cuda, "mpi" -> mpirun -np <mpi_ranks> pmemd.MPI
mpi_ranks = 2
max_jobs  = 0          # windows running at the same time; 0 = SLURM_CPUS_PER_TASK (or all cores)
done_marker = "production2.done"   # run.sh creates this in a window folder when all its steps finished

igb        = 1         # GB model; also decides the tleap radii set when radii_set = "auto"
radii_set  = "auto"    # or force one: "mbondi", "mbondi2", "mbondi3", "bondi"

# values written into the Amber .in files
temperature      = 298.15      # K (tempi and temp0)
restraint_wt     = 50.0
dt               = 0.001       # ps, production steps
minimize_maxcyc  = 500
minimize_ncyc    = 1000
steps_equil      = 20000       # nstlim of production_nopbc1.in
steps_production = 200000      # nstlim of production_nopbc2.in
gamma_ln         = 1.0
write_every      = 500         # ntpr / ntwe / ntwx
restart_every    = 5000        # ntwr

# ---------------------------------------------------------------------------
[slurm]                      # used by scripts/submit_arrays.py
partition      = "compute-p1,compute-p2"
account        = "research-me-pe"
max_running    = 64          # array tasks running at the same time (the cluster allows 64 running jobs per user)
max_array_size = 1000        # tasks per array (cluster maximum: 1001); more tasks are split over several arrays

# Simulation: every window that still has to be simulated goes into ONE list. The list is cut into
# work packages; one array task runs one package on sim_cpus CPUs, one window per CPU at a time.
sim_cpus               = 4      # CPUs requested per task
sim_task_hours         = 0.5      # max task time; default package size reserves 25% for longer-than-estimated windows
sim_minutes_per_window = 5      # estimated runtime per window; 4 hours and 5 min/window -> 36 windows per CPU
sim_mem_per_cpu        = "1G"

# Setup (scripts/main.py): one core per task, a few data points per task.
# The minutes are a first guess: look at the first setup logs and adjust.
setup_cpus                   = 1
setup_mem                    = "1G"
setup_data_points_per_task   = 1
setup_minutes_per_data_point = 2

# Analysis: isolate data points so JAX/PyMBAR memory is reclaimed between tasks.
analysis_data_points_per_task   = 1
analysis_minutes_per_data_point = 2
analysis_mem                    = "2G"

# Guest-only runs (submit_arrays.py implicit): run_implicit.py on a few data points per task,
# implicit_cpus of them at the same time.
implicit_cpus                   = 1
implicit_data_points_per_task   = 1
implicit_minutes_per_data_point = 10
implicit_mem                    = "1G"
