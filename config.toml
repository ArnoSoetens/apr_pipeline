# ============================================================================
# APR pipeline configuration -- the one file you edit.
#
#  * Relative paths are relative to the folder that contains this file.
#  * Python reads it through apr_pipeline/apr_config.py.
#  * Bash cannot read TOML, so scripts/config_env.py turns the values bash needs
#    into `export` lines (run.sh and open_windows.sh call it).
#  * A variable already exported in the environment wins over the config
#    (e.g. `export PMEMD=pmemd` in a slurm file, `export MAX_JOBS=4`).
# ============================================================================

# ---------------------------------------------------------------------------
[directories]
data      = "data"                   # data point folders (iso_00001, ...) are created here
host      = "data"                   # folder holding BCD.pdb, BCD.mol2, BCD.frcmod
scripts   = "scripts"
pipeline  = "apr_pipeline"           # the python modules
input_xml = "data/data_input.xml"    # enumerator output read by create_data_directories.py
templates = "scripts/templates"      # Amber .in templates ($placeholders)
inputs    = "scripts/inputs"         # rendered .in files, written by make_inputs.py
logs      = "logs"                   # slurm output files and the worklists of submitted arrays

# ---------------------------------------------------------------------------
[naming]
host_prefix    = "BCD"
guest_prefix   = "UNL"       # also the residue name of the guest
complex_prefix = "BCD-UNL"   # complex PDB is <complex_prefix>.pdb, final system <complex_prefix>-dum.prmtop
                             # use "" to build it as <host_prefix>-<guest_prefix>
folder_prefix  = "iso_"      # data point folders: iso_00001, iso_00002, ...
folder_digits  = 5

# ---------------------------------------------------------------------------
[structure]                  # SMILES -> 3D guest (RDKit)
conformers    = 1
random_seed   = 42
uff_max_iters = 1000

# ---------------------------------------------------------------------------
[placement]                  # guest placement in the host cavity
cavity_center = [0.0, 0.0, 0.0]   # the midpoint of the guest backbone goes here
cavity_axis   = [0.0, 0.0, 1.0]   # the guest backbone is aligned with this axis
clash_cutoff  = 1               # Angstrom; a closer host-guest pair rejects the guest
guest_resnum  = 2                 # residue number of the guest in the PDB files

# ---------------------------------------------------------------------------
[parametrize]                # antechamber / parmchk2
net_charge    = 0
charge_method = "bcc"
atom_type     = "gaff"       # antechamber -at, and leaprc.<atom_type> in tleap
parmchk_set   = 1            # parmchk2 -s  (1 = gaff, 2 = gaff2)

# ---------------------------------------------------------------------------
[apr]
# attach phase: percent of the final force constant, one value per window
attach_string    = "0.00 0.01 0.0375 0.40 0.80 1.60 2.40 4.00 5.50 8.65 11.80 18.10 24.40 37.00 49.60 74.80 100.00"
# pull phase: host-guest distance in Angstrom; windows = initial, initial+step, ... final
initial_distance = 6.0
final_distance   = 20.0
step             = 0.5

dummy_z           = [-6.0, -9.0, -11.2]   # z of dummy atoms DM1, DM2, DM3
dummy3_y          = 2.2                   # y of DM3
host_anchor_atoms = [75, 33, 138]         # BCD atom numbers used to hold the host in place

[apr.restraints]
distance_fc            = 10.0     # kcal/mol/A^2   (guest distance restraint)
angle_fc               = 100.0    # kcal/mol/rad^2
torsion_fc             = 100.0
angle_target           = 180.0    # degrees
torsion_target         = 180.0
static_fc              = [10.0, 100.0, 100.0, 100.0, 100.0, 100.0]   # the six host-dummy restraints, in order
host_conformational_fc = 10.0     # per-glucose conformational restraints

# ---------------------------------------------------------------------------
[analysis]
enhanced         = false          # true: also write the histogram plots and a detailed results.json
method           = "ti"           # "ti" (ti-block) or "mbar" (mbar-autoc)
bootstrap_cycles = 1000
trajectory       = "production.nc"   # file read from every window
results_csv      = "results.csv"

# ---------------------------------------------------------------------------
[run]
pmemd     = "serial"   # "serial" -> pmemd, "cuda" -> pmemd.cuda, "mpi" -> mpirun -np <mpi_ranks> pmemd.MPI
mpi_ranks = 2
max_jobs  = 0          # windows running at the same time; 0 = SLURM_CPUS_PER_TASK (or all cores)
done_marker = "production2.done"   # run.sh creates this in a window folder when all its steps finished

igb        = 1         # GB model; also decides the tleap radii set when radii_set = "auto"
radii_set  = "auto"    # or force one: "mbondi", "mbondi2", "mbondi3", "bondi"

# values written into the Amber .in files
temperature      = 298.15      # K (tempi and temp0)
restraint_wt     = 50.0
dt               = 0.001       # ps, production steps
minimize_maxcyc  = 500
minimize_ncyc    = 1000
steps_equil      = 20000       # nstlim of production_nopbc1.in
steps_production = 200000      # nstlim of production_nopbc2.in
gamma_ln         = 1.0
write_every      = 500         # ntpr / ntwe / ntwx
restart_every    = 5000        # ntwr

# ---------------------------------------------------------------------------
[slurm]                      # used by scripts/submit_arrays.py
partition      = "compute-p1,compute-p2"
account        = "research-me-pe"
max_running    = 64          # array tasks running at the same time (the cluster allows 64 running jobs per user)
max_array_size = 1000        # tasks per array (cluster maximum: 1001); more tasks are split over several arrays

# Simulation: every window that still has to be simulated goes into ONE list. The list is cut into
# work packages; one array task runs one package on sim_cpus CPUs, one window per CPU at a time.
sim_cpus               = 1      # CPUs requested per task
sim_windows_per_cpu    = 2     # work package = sim_cpus x this:  6 CPUs -> 270 windows, 4 CPUs -> 180 windows
sim_task_hours         = 4      # time limit of a task (45 windows x ~5 min = 3.75 h), automatically set to x1.5 work package estimate
sim_minutes_per_window = 5      # only for estimates, and for the time limit of small packages
sim_mem_per_cpu        = "1G"

# Setup (scripts/main.py): one core per task, a few data points per task.
# The minutes are a first guess: look at the first setup logs and adjust.
setup_cpus                   = 1
setup_mem                    = "1G"
setup_data_points_per_task   = 20
setup_minutes_per_data_point = 3

# Analysis: one core per task, a few data points per task
analysis_data_points_per_task   = 5
analysis_minutes_per_data_point = 2
analysis_mem                    = "1G"
